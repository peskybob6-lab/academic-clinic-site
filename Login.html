<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - AGORI Academic Clinic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 123, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal-content {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      width: 350px;
      text-align: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.3);
      position: relative;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.9);}
      to {opacity: 1; transform: scale(1);}
    }
    .modal-content h2 {
      margin-bottom: 20px;
      color: #007bff;
    }
    .modal-content input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .modal-content button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 12px;
      width: 95%;
    }
    .modal-content button:hover {
      background-color: #0056b3;
    }
    .close-icon {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 22px;
      cursor: pointer;
      color: #007bff;
    }
    .close-icon:hover {
      color: #0056b3;
    }
  </style>
</head>
<body>
  <!-- Login Modal -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-content">
      <span class="close-icon" onclick="goHome()">✖</span>
      <h2>Login</h2>
      <input type="email" id="loginEmail" placeholder="Email">
      <button onclick="loginAccount()">Send OTP</button>
    </div>
  </div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  const supabase = createClient(
    "https://fomowfqnswrsvuwzxmix.supabase.co",
    "sb_publishable_gB87Pwod8O3jMTAqixq4TQ_fqJKGVb1"
  );

  window.goHome = function() {
    window.location.href = "index.html";
  };

  // ✅ Login with OTP only
  window.loginAccount = async function() {
    const email = document.getElementById('loginEmail').value.trim();

    if (!email) {
      alert("Please enter your email.");
      return;
    }

    // Step 1: Send OTP
    const { error } = await supabase.auth.signInWithOtp({ email });

    if (error) {
      alert("Login failed: " + error.message);
      return;
    }

    alert("✅ Code sent to your email. Please enter it below.");
    const token = prompt("Enter the code you received:");

    if (!token) {
      alert("No code entered. Login cancelled.");
      return;
    }

    // Step 2: Verify OTP
    const { error: verifyError } = await supabase.auth.verifyOtp({
      email,
      token,
      type: 'email',
      options: { createUser: false } // user already exists
    });

    if (verifyError) {
      alert("Verification failed: " + verifyError.message);
    } else {
      alert("✅ Login successful! Thank You...");
      window.location.href = "index.html";
    }
  };
</script>
</body>
</html>

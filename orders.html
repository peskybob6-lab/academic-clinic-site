<!DOCTYPE html>
<html>
<head>
  <title>Orders Management - AGORI ACADEMIC CLINIC</title>
   <!-- Viewport for mobile responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #fff3e0; /* warm orange background for variety */
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    h2 {
      text-align: center;
      background-color: #ef6c00; /* deep orange header */
      color: white;
      padding: 15px;
      margin: 0;
      border-bottom: 4px solid #e65100;
    }

    #ordersList {
      max-width: 900px;
      margin: 20px auto;
      padding: 10px;
    }

    .order-card {
      background: white;
      border: 2px solid #ef6c00;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .order-card p {
      margin: 5px 0;
      font-size: 15px;
    }

    .order-card strong {
      color: #333;
    }

    .order-card button {
      background-color: #43a047; /* green for action */
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    .order-card button:hover {
      background-color: #2e7d32;
    }

    /* Back to Dashboard button */
    .back-btn {
      display: inline-block;
      margin: 15px;
      background-color: #007bff;
      color: white;
      padding: 8px 14px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
    }
    .back-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h2>Customer Orders</h2>

  <!-- Back to Dashboard button -->
  <a href="dashboard.html" class="back-btn">⟵ Back to Dashboard</a>

  <div id="ordersList"></div>

  <script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  // ✅ Supabase client
  const supabase = createClient(
    "https://fomowfqnswrsvuwzxmix.supabase.co",   // Project URL
    "sb_publishable_gB87Pwod8O3jMTAqixq4TQ_fqJKGVb1" // Publishable key
  );

  // Load orders from Supabase
  async function loadOrders() {
    const ordersList = document.getElementById("ordersList");
    ordersList.innerHTML = "";

    const { data, error } = await supabase
      .from("orders")
      .select("*");

    if (error) {
      console.error("Error loading orders:", error.message);
      return;
    }

    data.forEach(order => {
      const orderDiv = document.createElement("div");
      orderDiv.className = "order-card";
      orderDiv.innerHTML = `
        <p><strong>Book:</strong> ${order.bookTitle}</p>
        <p><strong>Customer:</strong> ${order.customerEmail}</p>
        <p><strong>Price:</strong> ₦${order.price}</p>
        <p><strong>Status:</strong> ${order.status}</p>
        <button onclick="markPaid('${order.id}')">Mark as Paid</button>
      `;
      ordersList.appendChild(orderDiv);
    });
  }

  // Mark order as paid
  window.markPaid = async function(orderId) {
    const { error } = await supabase
      .from("orders")
      .update({ status: "Paid" })
      .eq("id", orderId);

    if (error) {
      alert("Error updating order: " + error.message);
    } else {
      alert("Order marked as Paid!");
      loadOrders();
    }
  };

  // Load orders on page start
  loadOrders();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Payment History - AGORI ACADEMIC CLINIC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #f9fbe7;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    h2 {
      text-align: center;
      background-color: #c0ca33;
      color: white;
      padding: 15px;
      margin: 0;
      border-bottom: 4px solid #9e9d24;
    }

    #paymentsList {
      max-width: 900px;
      margin: 20px auto;
      padding: 10px;
    }

    .payment-card {
      background: white;
      border: 2px solid #c0ca33;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .payment-card p {
      margin: 5px 0;
      font-size: 15px;
    }

    .payment-card strong {
      color: #333;
    }

    .back-btn {
      display: inline-block;
      margin: 15px;
      background-color: #007bff;
      color: white;
      padding: 8px 14px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
    }
    .back-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h2>Payment History</h2>

  <a href="dashboard.html" class="back-btn">⟵ Back to Dashboard</a>

  <div id="paymentsList"></div>

  <script type="module">
    async function loadPayments() {
      const paymentsList = document.getElementById("paymentsList");
      paymentsList.innerHTML = "<p>Loading payments...</p>";

      try {
        // ✅ Fetch from your Supabase Edge Function
        const response = await fetch("https://fomowfqnswrsvuwzxmix.supabase.co/functions/v1/payments");
        const result = await response.json();

        paymentsList.innerHTML = "";

        if (result.data && result.data.length > 0) {
          result.data.forEach(tx => {
            // Format amount with commas
            const formattedAmount = (tx.amount / 100).toLocaleString("en-NG");

            const txDiv = document.createElement("div");
            txDiv.className = "payment-card";
            txDiv.innerHTML = `
              <p><strong>Customer:</strong> ${tx.customer?.email || "N/A"}</p>
              <p><strong>Amount:</strong> ₦${formattedAmount}</p>
              <p><strong>Status:</strong> ${tx.status}</p>
              <p><strong>Date:</strong> ${new Date(tx.created_at).toLocaleString()}</p>
            `;
            paymentsList.appendChild(txDiv);
          });
        } else {
          paymentsList.innerHTML = "<p>No payments found.</p>";
        }
      } catch (err) {
        paymentsList.innerHTML = "<p>Error loading payments: " + err.message + "</p>";
      }
    }

    loadPayments();
  </script>
</body>
</html>

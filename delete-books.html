<!DOCTYPE html>
<html>
<head>
  <title>Delete Books - AGORI ACADEMIC CLINIC</title>
   <!-- Viewport for mobile responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    h2 {
      text-align: center;
      background-color: #007bff;
      color: white;
      padding: 15px;
      margin: 0;
      border-bottom: 4px solid #0056b3;
    }

    #booksList {
      max-width: 800px;
      margin: 20px auto;
      padding: 10px;
    }

    .book-card {
      background: white;
      border: 2px solid #007bff;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .book-card strong {
      color: #333;
    }

    .book-card button {
      background-color: #ff5722;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .book-card button:hover {
      background-color: #e64a19;
    }

    /* Back to Dashboard button */
    .back-btn {
      display: inline-block;
      margin: 15px;
      background-color: #007bff;
      color: white;
      padding: 8px 14px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
    }
    .back-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h2>Delete Books</h2>

  <!-- Back to Dashboard button -->
  <a href="dashboard.html" class="back-btn">⟵ Back to Dashboard</a>

  <div id="booksList"></div>

  <script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  // ✅ Supabase client
  const supabase = createClient(
    "https://fomowfqnswrsvuwzxmix.supabase.co",   // Project URL
    "sb_publishable_gB87Pwod8O3jMTAqixq4TQ_fqJKGVb1" // Publishable key
  );

  // Load books from Supabase
  async function loadBooks() {
    const booksList = document.getElementById("booksList");
    booksList.innerHTML = "";

    const { data, error } = await supabase
      .from("books")
      .select("*");

    if (error) {
      console.error("Error loading books:", error.message);
      return;
    }

    data.forEach(book => {
      const bookDiv = document.createElement("div");
      bookDiv.className = "book-card";
      bookDiv.innerHTML = `
        <span><strong>${book.title}</strong> - ₦${book.price}</span>
        <button onclick="deleteBook('${book.id}')">Delete</button>
      `;
      booksList.appendChild(bookDiv);
    });
  }

  // Delete book
  window.deleteBook = async function(bookId) {
    if (!confirm("Are you sure you want to delete this book?")) return;

    const { error } = await supabase
      .from("books")
      .delete()
      .eq("id", bookId);

    if (error) {
      alert("Error deleting book: " + error.message);
    } else {
      alert("Book deleted successfully!");
      loadBooks();
    }
  };

  // Load books on page start
  loadBooks();
</script>
</body>
</html>

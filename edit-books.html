<!DOCTYPE html>
<html>
<head>
  <title>Edit Books - AGORI ACADEMIC CLINIC</title>
   <!-- Viewport for mobile responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #e8f5e9; /* soft green background for variety */
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    h2 {
      text-align: center;
      background-color: #388e3c; /* deep green header */
      color: white;
      padding: 15px;
      margin: 0;
      border-bottom: 4px solid #2e7d32;
    }

    #booksList {
      max-width: 800px;
      margin: 20px auto;
      padding: 10px;
    }

    .book-card {
      background: white;
      border: 2px solid #388e3c;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .book-card input {
      display: block;
      margin: 8px 0;
      padding: 8px;
      width: 95%;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .book-card button {
      margin-right: 10px;
      margin-top: 8px;
      padding: 8px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .save-btn {
      background-color: #388e3c;
      color: white;
    }
    .save-btn:hover {
      background-color: #2e7d32;
    }

    .delete-btn {
      background-color: #d32f2f;
      color: white;
    }
    .delete-btn:hover {
      background-color: #b71c1c;
    }

    /* Back to Dashboard button */
    .back-btn {
      display: inline-block;
      margin: 15px;
      background-color: #007bff;
      color: white;
      padding: 8px 14px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
    }
    .back-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h2>Edit Existing Books</h2>

  <!-- Back to Dashboard button -->
  <a href="dashboard.html" class="back-btn">⟵ Back to Dashboard</a>

  <div id="booksList"></div>

  <script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  // ✅ Supabase client
  const supabase = createClient(
    "https://fomowfqnswrsvuwzxmix.supabase.co",   // Project URL
    "sb_publishable_gB87Pwod8O3jMTAqixq4TQ_fqJKGVb1" // Publishable key
  );

  // Load books from Supabase
  async function loadBooks() {
    const booksList = document.getElementById("booksList");
    booksList.innerHTML = "";

    const { data, error } = await supabase
      .from("books")
      .select("*");

    if (error) {
      console.error("Error loading books:", error.message);
      return;
    }

    data.forEach(book => {
      const bookDiv = document.createElement("div");
      bookDiv.className = "book-card";
      bookDiv.innerHTML = `
        <p><strong>${book.title}</strong> - ₦${book.price}</p>
        <input type="text" id="title-${book.id}" value="${book.title}">
        <input type="number" id="price-${book.id}" value="${book.price}">
        <button class="save-btn" onclick="saveEdit('${book.id}')">Save Changes</button>
        <button class="delete-btn" onclick="deleteBook('${book.id}')">Delete</button>
      `;
      booksList.appendChild(bookDiv);
    });
  }

  // Save edited book
  window.saveEdit = async function(bookId) {
    const newTitle = document.getElementById("title-" + bookId).value;
    const newPrice = document.getElementById("price-" + bookId).value;

    const { error } = await supabase
      .from("books")
      .update({ title: newTitle, price: newPrice })
      .eq("id", bookId);

    if (error) {
      alert("Error updating book: " + error.message);
    } else {
      alert("Book updated successfully!");
      loadBooks();
    }
  };

  // Delete book
  window.deleteBook = async function(bookId) {
    if (!confirm("Are you sure you want to delete this book?")) return;

    const { error } = await supabase
      .from("books")
      .delete()
      .eq("id", bookId);

    if (error) {
      alert("Error deleting book: " + error.message);
    } else {
      alert("Book deleted successfully!");
      loadBooks();
    }
  };

  // Load books on page start
  loadBooks();
</script>
</body>
</html>

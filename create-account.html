<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account - AGORI Academic Clinic</title>
   <!-- Viewport for mobile responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    /* Overlay background */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 123, 255, 0.85); /* blue overlay */
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    /* Modal box */
    .modal-content {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      width: 380px;
      text-align: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.3);
      position: relative;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.9);}
      to {opacity: 1; transform: scale(1);}
    }

    .modal-content h2 {
      margin-bottom: 20px;
      color: #007bff;
    }

    .modal-content input, .modal-content select {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .modal-content button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 12px;
      width: 95%;
    }

    .modal-content button:hover {
      background-color: #0056b3;
    }

    /* Close icon */
    .close-icon {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 22px;
      cursor: pointer;
      color: #007bff;
    }
    .close-icon:hover {
      color: #0056b3;
    }
  </style>
</head>
<body>
<!-- Registration Modal -->
<div id="registerModal" class="modal-overlay">
  <div class="modal-content">
    <span class="close-icon" onclick="goHome()">✖</span>
    <h2>Create Account</h2>

    <!-- Step 1 -->
    <div id="step1">
      <input type="text" id="firstName" placeholder="First Name" required>
      <button onclick="validateAndAdvance(2)">Next</button>
    </div>

    <!-- Step 2 -->
    <div id="step2" style="display:none;">
      <input type="text" id="lastName" placeholder="Last Name" required>
      <button onclick="validateAndAdvance(3)">Next</button>
    </div>

    <!-- Step 3 -->
    <div id="step3" style="display:none;">
      <input type="email" id="email" placeholder="Email" required>
      <button onclick="validateAndAdvance(4)">Next</button>
    </div>

    <!-- Step 4 -->
    <div id="step4" style="display:none;">
      <input type="tel" id="phone" placeholder="Phone Number" required>
      <button onclick="validateAndAdvance(5)">Next</button>
    </div>

    <!-- Step 5 -->
    <div id="step5" style="display:none;">
      <input type="password" id="password" placeholder="Password" required>
      <button onclick="validateAndAdvance(6)">Next</button>
    </div>

    <!-- Step 6 -->
    <div id="step6" style="display:none;">
      <select id="gender" required>
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
      <button onclick="validateAndAdvance(7)">Next</button>
    </div>

    <!-- Step 7 -->
    <div id="step7" style="display:none;">
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
      <button onclick="createAccount()">Create Account</button>
    </div>

    <!-- Step 8 -->
    <div id="step8" style="display:none;">
      <input type="text" id="verificationCode" placeholder="Enter Code sent to your email required">
      <button onclick="verifyCode()">Verify</button>
    </div>
  </div>
</div>
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  const supabase = createClient(
    "https://fomowfqnswrsvuwzxmix.supabase.co",
    "sb_publishable_gB87Pwod8O3jMTAqixq4TQ_fqJKGVb1"
  );

  // Step navigation
  window.nextStep = function(step) {
    for (let i = 1; i <= 8; i++) {
      const el = document.getElementById("step" + i);
      if (el) el.style.display = "none";
    }
    document.getElementById("step" + step).style.display = "block";
  };

  window.validateAndAdvance = function(nextStep) {
    const currentStep = document.getElementById("step" + (nextStep - 1));
    const requiredFields = currentStep ? currentStep.querySelectorAll("[required]") : [];

    for (const field of requiredFields) {
      if (!field.value.trim()) {
        field.reportValidity();
        field.focus();
        return;
      }
    }

    window.nextStep(nextStep);
  };

  window.goHome = function() {
    window.location.href = "index.html";
  };

  // ✅ Create Account (send OTP)
  window.createAccount = async function() {
    const emailField = document.getElementById("email");
    const passwordField = document.getElementById("password");
    const confirmPasswordField = document.getElementById("confirmPassword");

    if (!emailField.value.trim()) {
      emailField.reportValidity();
      emailField.focus();
      return;
    }

    if (!passwordField.value.trim()) {
      passwordField.reportValidity();
      passwordField.focus();
      return;
    }

    if (!confirmPasswordField.value.trim()) {
      confirmPasswordField.reportValidity();
      confirmPasswordField.focus();
      return;
    }

    if (passwordField.value !== confirmPasswordField.value) {
      confirmPasswordField.setCustomValidity("Passwords do not match.");
      confirmPasswordField.reportValidity();
      confirmPasswordField.setCustomValidity("");
      confirmPasswordField.focus();
      return;
    }

    const email = emailField.value.trim();

    const { error } = await supabase.auth.signInWithOtp({ email });

    if (error) {
      alert("Error sending OTP: " + error.message);
    } else {
      alert("OTP has been sent to your email!");
      document.getElementById("step7").style.display = "none";
      document.getElementById("step8").style.display = "block";
    }
  };

  // ✅ Verify OTP and save to customers table
  window.verifyCode = async function() {
    const email = document.getElementById("email").value;
    const code = document.getElementById("verificationCode").value;

    const firstName = document.getElementById("firstName").value;
    const lastName = document.getElementById("lastName").value;
    const phone = document.getElementById("phone").value;
    const gender = document.getElementById("gender").value;

    const { data, error } = await supabase.auth.verifyOtp({
      email,
      token: code,
      type: "email",
      options: { createUser: true }
    });

    if (error) {
      alert("Error verifying code: " + error.message);
    } else {
      // ✅ Insert into customers table
      const { error: insertError } = await supabase.from("customers").insert({
        first_name: firstName,
        last_name: lastName,
        email: email,
        phone_number: phone,
        gender: gender,
        created_at: new Date()
      });

      if (insertError) {
        alert("Error saving customer: " + insertError.message);
      } else {
        alert("✅ Account created successfully");
        window.location.href = "index.html";
      }
    }
  };
</script>

</body>
</html>

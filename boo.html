<!doctype html>
<html>
  <head>
    <title>Upload Book - AGORI ACADEMIC CLINIC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <link rel="stylesheet" href="css/css/boo.css" />
   
  </head>
  <body>
    <div class="upload-container" id="uploadContainer">
      <h2>Upload New Book</h2>

      <div id="uploadSuccessMessage" class="upload-success-message" aria-live="polite"></div>

      <div id="uploadFormSection" class="upload-form-section">
        <input type="text" id="title" placeholder="Book Title" />
        <input type="number" id="price" placeholder="Price" />
        <label for="cover">Choose Cover Page:</label>
        <input type="file" id="cover" type="image" />
        <label for="pdf">Choose PDF File:</label>
        <input type="file" id="pdf" />
        <button id="uploadBtn" type="button">
          <span class="btn-content">
            <span class="btn-spinner" aria-hidden="true"></span>
            <span class="btn-label">Upload</span>
          </span>
        </button>
        <a href="dashboard.html" class="back-btn">⟵ Back to Dashboard</a>
      </div>
    </div>

     <script type="module" src="javascript/boo.js"></script>

     </body>
</html>

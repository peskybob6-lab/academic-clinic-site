<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MY DR. AGORI ACADEMIC CLINIC ACCOUNT</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: #007bff;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 26px;
      font-weight: bold;
    }
    .account-info {
      padding: 30px;
      text-align: left;
    }
    .welcome {
      font-size: 22px;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }
    .info {
      font-size: 18px;
      color: #555;
      margin-bottom: 12px;
    }
    .link-btn {
      display: inline-block;
      background: #28a745;
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s;
    }
    .link-btn:hover {
      background: #218838;
      cursor: pointer;
    }
    footer {
      background: #f1f1f1;
      padding: 15px;
      text-align: center;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <header>MY DR. AGORI ACADEMIC CLINIC ACCOUNT</header>

  <div class="account-info">
    <div id="welcome" class="welcome">Welcome, User</div>
    <div id="email" class="info"></div>

    <!-- Link to My Books -->
    <a href="daily-upgrade.html" class="link-btn">📚 Daily Upgrade </a>
    <a href="life-motivation.html" class="link-btn">💡 Life Motivation</a>
  </div>

  <footer>
    <a href="index.html" class="back-home">← Back to Home Page</a>
  </footer>
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  const supabase = createClient(
    "https://fomowfqnswrsvuwzxmix.supabase.co",
    "sb_publishable_gB87Pwod8O3jMTAqixq4TQ_fqJKGVb1"
  );

  async function loadAccount() {
    const { data: { user }, error: userError } = await supabase.auth.getUser();

    if (userError || !user) {
      document.getElementById("welcome").innerText = "Please log in";
      document.getElementById("email").innerText = "";
      return;
    }

    // Look up customer record by email
    const { data: customer, error } = await supabase
      .from("customers")
      .select("first_name, last_name")
      .eq("email", user.email)
      .single();

    if (error || !customer) {
      // fallback: show only email once
      document.getElementById("welcome").innerText = "Welcome";
      document.getElementById("email").innerText = user.email;
      return;
    }

    // Show full details
    const fullName = `${customer.first_name ?? ""} ${customer.last_name ?? ""}`.trim();
    document.getElementById("welcome").innerText = `Welcome, ${fullName}`;
    document.getElementById("email").innerText = user.email;
  }

  loadAccount();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/css/my-account.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">👤</span>
          <span>My Profile</span>
        </div>
        <a href="index.html" class="home-link">← Home</a>
      </header>

      <main class="profile-page">
        <section class="profile-card">
          <div class="profile-header">
            <label class="avatar-upload" for="profileImageInput" aria-label="Change profile picture">
              <img id="profileImage" src="" alt="Profile preview" />
              <span class="camera-badge">📷</span>
              <input id="profileImageInput" type="file" accept="image/*" />
            </label>

            <div class="profile-meta">
              <div class="profile-label">
                <span class="user-icon">👤</span>
                <span id="profileName">Loading...</span>
              </div>
              <div class="profile-subtitle" id="profilePhone">Phone number</div>
            </div>
          </div>

          <div class="profile-login-panel" id="profileLoginPrompt" style="display: none;">
            <p>Please log in to manage your profile.</p>
            <a href="login.html" class="profile-login-btn">Login</a>
          </div>

          <div class="mini-grid">
            <div class="info-pill">
              <span>Full Name</span>
              <strong id="fullNameValue">-</strong>
            </div>
            <div class="info-pill">
              <span>Phone Number</span>
              <strong id="phoneValue">-</strong>
            </div>
          </div>

          <div class="action-rail">
            <a href="daily-upgrade.html" class="link-btn primary">📚 Daily Upgrade</a>
            <a href="life-motivation.html" class="link-btn secondary">💡 Life Motivation</a>
          </div>
        </section>

        <section class="settings-grid">
          <div class="panel">
            <h3>Change Password</h3>
            <form id="passwordForm" autocomplete="off">
              <label>
                Old Password
                <input type="password" id="oldPassword" placeholder="Enter current password" required />
              </label>

              <label>
                New Password
                <input type="password" id="newPassword" placeholder="Enter new password" required minlength="6" />
              </label>

              <label>
                Confirm New Password
                <input type="password" id="confirmNewPassword" placeholder="Confirm new password" required />
              </label>

              <button type="submit">Update Password</button>
            </form>
            <p id="passwordStatus" class="status-text" aria-live="polite"></p>
          </div>

          <div class="panel">
            <h3>Update Phone Number</h3>
            <form id="phoneForm" autocomplete="off">
              <label>
                Current Phone Number
                <input type="tel" id="currentPhone" readonly />
              </label>

              <label>
                New Phone Number
                <input type="tel" id="newPhone" placeholder="Enter new phone number" required />
              </label>

              <label>
                Confirm New Phone Number
                <input type="tel" id="confirmPhone" placeholder="Confirm new phone number" required />
              </label>

              <button type="submit">Update Phone Number</button>
            </form>
            <p id="phoneStatus" class="status-text" aria-live="polite"></p>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="javascript/my-account.js"></script>
  </body>
</html>
